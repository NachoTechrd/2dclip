<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="dogFur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="dogDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="216" rx="84" ry="11" fill="#020617" opacity="0.42"/>
  <g filter="url(#dogDrop)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="0.4s" repeatCount="indefinite"/>

    <!-- Wagging Tail -->
    <path d="M84,126 Q52,96 66,76" fill="none" stroke="#d97706" stroke-width="14" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-12 84 126; 16 84 126; -12 84 126" dur="0.45s" repeatCount="indefinite"/>
    </path>

    <!-- Legs -->
    <path d="M104,154 L94,204" stroke="#b45309" stroke-width="16" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="18 104 154; -18 104 154; 18 104 154" dur="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M122,154 L132,204" stroke="#f59e0b" stroke-width="16" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-18 122 154; 18 122 154; -18 122 154" dur="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M196,154 L186,204" stroke="#b45309" stroke-width="16" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-18 196 154; 18 196 154; -18 196 154" dur="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M214,154 L224,204" stroke="#f59e0b" stroke-width="16" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="18 214 154; -18 214 154; 18 214 154" dur="0.5s" repeatCount="indefinite"/>
    </path>

    <!-- Body -->
    <rect x="82" y="106" width="144" height="62" rx="30" fill="url(#dogFur)" stroke="#0f172a" stroke-width="4.5"/>
    <!-- Red Collar -->
    <rect x="196" y="100" width="22" height="58" rx="8" fill="#ef4444" stroke="#0f172a" stroke-width="3.5" transform="rotate(-14 207 129)"/>

    <!-- Head & Snout -->
    <circle cx="228" cy="96" r="34" fill="url(#dogFur)" stroke="#0f172a" stroke-width="4.5"/>
    <ellipse cx="262" cy="102" rx="18" ry="13" fill="#fde68a" stroke="#0f172a" stroke-width="3.5"/>
    <circle cx="274" cy="96" r="6" fill="#0f172a"/>
    <circle cx="238" cy="86" r="4.5" fill="#0f172a"/>
    <!-- Floppy Ear -->
    <ellipse cx="206" cy="98" rx="12" ry="22" fill="#92400e" stroke="#0f172a" stroke-width="3.5" transform="rotate(14 206 98)"/>
  </g>
</svg>