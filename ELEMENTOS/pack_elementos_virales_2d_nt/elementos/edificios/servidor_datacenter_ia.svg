<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="dcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rackBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="dcNeon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dcDrop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="176" fill="url(#dcGlow)"/>
  <ellipse cx="200" cy="364" rx="146" ry="16" fill="#020617" opacity="0.55"/>

  <g filter="url(#dcDrop)">
    <!-- Side Isometric Depth -->
    <polygon points="274,70 326,96 326,336 274,352" fill="#0f172a" stroke="#020617" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="74,96 126,70 274,70 222,96" fill="#334155" stroke="#020617" stroke-width="4" stroke-linejoin="round"/>

    <!-- Main Server Rack -->
    <rect x="86" y="76" width="200" height="276" rx="16" fill="url(#rackBody)" stroke="#38bdf8" stroke-width="4"/>

    <!-- Server Blades -->
    <g>
      <rect x="104" y="98" width="164" height="44" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>
      <rect x="116" y="114" width="76" height="10" rx="5" fill="#1e293b"/>
      <circle cx="222" cy="119" r="5" fill="#22d3ee" filter="url(#dcNeon)"/>
      <circle cx="240" cy="119" r="5" fill="#10b981" filter="url(#dcNeon)">
        <animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="256" cy="119" r="5" fill="#38bdf8" filter="url(#dcNeon)"/>

      <rect x="104" y="154" width="164" height="44" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>
      <rect x="116" y="170" width="76" height="10" rx="5" fill="#1e293b"/>
      <circle cx="222" cy="175" r="5" fill="#10b981" filter="url(#dcNeon)"/>
      <circle cx="240" cy="175" r="5" fill="#22d3ee" filter="url(#dcNeon)">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="256" cy="175" r="5" fill="#a855f7" filter="url(#dcNeon)"/>

      <rect x="104" y="210" width="164" height="44" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>
      <rect x="116" y="226" width="76" height="10" rx="5" fill="#1e293b"/>
      <circle cx="222" cy="231" r="5" fill="#38bdf8" filter="url(#dcNeon)"/>
      <circle cx="240" cy="231" r="5" fill="#38bdf8" filter="url(#dcNeon)"/>
      <circle cx="256" cy="231" r="5" fill="#10b981" filter="url(#dcNeon)">
        <animate attributeName="opacity" values="1;0.3;1" dur="0.7s" repeatCount="indefinite"/>
      </circle>

      <!-- Cooling & AI Core Bottom Module -->
      <rect x="104" y="266" width="164" height="66" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="2.5"/>
      <circle cx="150" cy="299" r="20" fill="#020617" stroke="#22d3ee" stroke-width="2.5"/>
      <circle cx="150" cy="299" r="7" fill="#22d3ee" filter="url(#dcNeon)"/>
      <rect x="184" y="284" width="68" height="30" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <text x="218" y="304" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#34d399">99.9%</text>
    </g>
  </g>
</svg>