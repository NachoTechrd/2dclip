<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="courtGlow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stoneCourt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="courtDrop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="175" fill="url(#courtGlow)"/>
  <ellipse cx="200" cy="364" rx="156" ry="15" fill="#020617" opacity="0.5"/>

  <g filter="url(#courtDrop)">
    <rect x="46" y="330" width="308" height="22" rx="4" fill="#64748b" stroke="#0f172a" stroke-width="4"/>
    <rect x="66" y="310" width="268" height="22" rx="4" fill="url(#stoneCourt)" stroke="#0f172a" stroke-width="4"/>
    <rect x="92" y="150" width="216" height="160" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>

    <!-- Columns -->
    <g fill="url(#stoneCourt)" stroke="#0f172a" stroke-width="4">
      <rect x="96" y="156" width="24" height="152"/>
      <rect x="148" y="156" width="24" height="152"/>
      <rect x="228" y="156" width="24" height="152"/>
      <rect x="280" y="156" width="24" height="152"/>
    </g>

    <!-- Oak Court Doors -->
    <rect x="180" y="232" width="40" height="78" rx="4" fill="#92400e" stroke="#0f172a" stroke-width="3.5"/>

    <!-- Roof Pediment -->
    <rect x="68" y="128" width="264" height="24" rx="4" fill="url(#stoneCourt)" stroke="#0f172a" stroke-width="4"/>
    <polygon points="54,130 200,54 346,130" fill="url(#stoneCourt)" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/>

    <!-- Scales of Justice Icon -->
    <line x1="200" y1="74" x2="200" y2="116" stroke="#d97706" stroke-width="4"/>
    <line x1="172" y1="86" x2="228" y2="86" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
    <path d="M164,104 L172,86 L180,104 Z" fill="#facc15" stroke="#0f172a" stroke-width="2"/>
    <path d="M220,104 L228,86 L236,104 Z" fill="#facc15" stroke="#0f172a" stroke-width="2"/>
  </g>
</svg>