<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="storeGlow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassWindow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="storeDrop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="175" fill="url(#storeGlow)"/>
  <ellipse cx="200" cy="360" rx="158" ry="16" fill="#020617" opacity="0.48"/>

  <g filter="url(#storeDrop)">
    <!-- Building Shell -->
    <rect x="64" y="92" width="272" height="248" rx="16" fill="#f1f5f9" stroke="#0f172a" stroke-width="5"/>
    <!-- Roof Sign -->
    <rect x="110" y="54" width="180" height="44" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="4"/>
    <text x="200" y="83" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="20" fill="#34d399">OPEN 24/7</text>

    <!-- Striped Awning -->
    <g stroke="#0f172a" stroke-width="3.5">
      <path d="M52,150 L72,114 L328,114 L348,150 Z" fill="#ef4444"/>
      <polygon points="94,114 134,114 122,150 78,150" fill="#ffffff"/>
      <polygon points="178,114 222,114 222,150 178,150" fill="#ffffff"/>
      <polygon points="266,114 306,114 322,150 278,150" fill="#ffffff"/>
    </g>

    <!-- Storefront Glass & POS Screen -->
    <rect x="86" y="176" width="136" height="120" rx="10" fill="url(#glassWindow)" stroke="#0f172a" stroke-width="4"/>
    <path d="M98,188 L128,188 L104,238 Z" fill="#ffffff" opacity="0.35"/>
    <!-- POS Terminal silhouette inside window -->
    <rect x="122" y="230" width="64" height="44" rx="6" fill="#0f172a"/>
    <rect x="130" y="236" width="48" height="24" rx="3" fill="#22d3ee"/>

    <!-- Entrance Door -->
    <rect x="240" y="176" width="76" height="164" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
    <rect x="252" y="190" width="52" height="90" rx="4" fill="url(#glassWindow)" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="250" cy="296" r="5" fill="#facc15"/>

    <!-- Base Sidewalk Trim -->
    <rect x="52" y="332" width="296" height="18" rx="6" fill="#334155" stroke="#0f172a" stroke-width="4"/>
  </g>
</svg>