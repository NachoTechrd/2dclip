<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bankGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="marbleLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="marbleShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="goldCoin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="bankShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="175" fill="url(#bankGlow)"/>
  <ellipse cx="200" cy="364" rx="158" ry="16" fill="#020617" opacity="0.5"/>

  <g filter="url(#bankShadow)">
    <!-- Stepped Plinth -->
    <rect x="44" y="330" width="312" height="22" rx="4" fill="url(#marbleShade)" stroke="#0f172a" stroke-width="4"/>
    <rect x="62" y="310" width="276" height="22" rx="4" fill="url(#marbleLight)" stroke="#0f172a" stroke-width="4"/>
    <rect x="78" y="294" width="244" height="18" rx="3" fill="#e2e8f0" stroke="#0f172a" stroke-width="4"/>

    <!-- Interior Dark Vault Backing -->
    <rect x="92" y="148" width="216" height="148" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
    <!-- Vault Arched Door -->
    <path d="M174,296 L174,216 C174,196 226,196 226,216 L226,296 Z" fill="#0f172a" stroke="#facc15" stroke-width="3.5"/>
    <circle cx="200" cy="248" r="14" fill="none" stroke="#facc15" stroke-width="3"/>

    <!-- 4 Fluted Marble Columns -->
    <g fill="url(#marbleLight)" stroke="#0f172a" stroke-width="4">
      <rect x="96" y="154" width="26" height="140" rx="3"/>
      <rect x="148" y="154" width="26" height="140" rx="3"/>
      <rect x="226" y="154" width="26" height="140" rx="3"/>
      <rect x="278" y="154" width="26" height="140" rx="3"/>
    </g>

    <!-- Architrave & Classical Pediment -->
    <rect x="66" y="128" width="268" height="26" rx="4" fill="url(#marbleLight)" stroke="#0f172a" stroke-width="4"/>
    <polygon points="52,130 200,52 348,130" fill="url(#marbleLight)" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="90,122 200,68 310,122" fill="url(#marbleShade)" stroke="#0f172a" stroke-width="3"/>

    <!-- Gold Dollar Emblem -->
    <circle cx="200" cy="100" r="24" fill="url(#goldCoin)" stroke="#0f172a" stroke-width="3.5"/>
    <text x="200" y="110" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="28" fill="#451a03">$</text>
  </g>
</svg>