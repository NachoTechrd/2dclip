<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="winGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.42"/>
      <stop offset="65%" stop-color="#facc15" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emeraldCoat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="200" cy="190" r="175" fill="url(#winGlow)"/>
  <ellipse cx="200" cy="368" rx="115" ry="15" fill="#020617" opacity="0.45"/>

  <!-- Rising Sparkles -->
  <path d="M84,120 L89,134 L103,139 L89,144 L84,158 L79,144 L65,139 L79,134 Z" fill="#facc15">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.7s" repeatCount="indefinite"/>
  </path>
  <path d="M316,96 L321,110 L335,115 L321,120 L316,134 L311,120 L297,115 L311,110 Z" fill="#34d399">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#heroShadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="2.8s" repeatCount="indefinite"/>
    <!-- Suit & Shirt -->
    <path d="M96,354 C100,256 136,222 200,222 C264,222 300,256 304,354 Z" fill="url(#emeraldCoat)" stroke="#0f172a" stroke-width="5"/>
    <polygon points="172,224 228,224 200,294" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <polygon points="194,238 206,238 208,292 200,304 192,292" fill="#facc15" stroke="#0f172a" stroke-width="2.5"/>

    <!-- Neck & Head -->
    <rect x="180" y="194" width="40" height="32" rx="8" fill="#fdba74" stroke="#0f172a" stroke-width="4"/>
    <rect x="136" y="88" width="128" height="118" rx="52" fill="#fed7aa" stroke="#0f172a" stroke-width="5"/>
    <path d="M134,126 C136,68 186,54 226,64 C260,72 268,98 264,126 C248,100 220,96 196,98 C168,96 146,104 134,126 Z" fill="#1e293b"/>

    <!-- Happy Eyes & Big Smile -->
    <circle cx="176" cy="140" r="6" fill="#0f172a"/>
    <circle cx="224" cy="140" r="6" fill="#0f172a"/>
    <path d="M174,166 Q200,192 226,166 Z" fill="#ffffff" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>

    <!-- Raised Thumbs-Up / Growth Badge -->
    <circle cx="306" cy="218" r="32" fill="#facc15" stroke="#0f172a" stroke-width="4"/>
    <path d="M292,228 L302,216 L309,221 L322,204" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>