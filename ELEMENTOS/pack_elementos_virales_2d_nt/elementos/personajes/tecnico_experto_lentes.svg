<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="techBg" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="techShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="200" cy="195" r="175" fill="url(#techBg)"/>
  <ellipse cx="200" cy="366" rx="110" ry="15" fill="#020617" opacity="0.45"/>

  <g filter="url(#techShadow)">
    <!-- Tech Jacket -->
    <path d="M96,352 C98,254 134,224 200,224 C266,224 302,254 304,352 Z" fill="url(#hoodie)" stroke="#0f172a" stroke-width="5"/>
    <path d="M174,226 L200,266 L226,226 Z" fill="#38bdf8" stroke="#0f172a" stroke-width="3"/>

    <!-- Neck & Head -->
    <rect x="180" y="196" width="40" height="30" rx="8" fill="#fdba74" stroke="#0f172a" stroke-width="4"/>
    <rect x="134" y="88" width="132" height="118" rx="52" fill="#fed7aa" stroke="#0f172a" stroke-width="5"/>

    <!-- Styled Hair -->
    <path d="M132,126 C132,68 184,54 222,64 C258,72 270,96 266,128 C252,102 224,96 196,98 C166,94 146,104 132,126 Z" fill="#0f172a"/>

    <!-- Precision Loupe Glasses -->
    <rect x="148" y="128" width="44" height="28" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="3.5"/>
    <rect x="208" y="128" width="44" height="28" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="3.5"/>
    <circle cx="170" cy="142" r="9" fill="#22d3ee" opacity="0.9"/>
    <circle cx="230" cy="142" r="9" fill="#22d3ee" opacity="0.9"/>
    <line x1="192" y1="140" x2="208" y2="140" stroke="#38bdf8" stroke-width="4"/>

    <!-- Confident Smile -->
    <path d="M180,174 Q200,186 220,174" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Pro Laptop / Diagnostics Tablet in front -->
    <rect x="118" y="274" width="164" height="84" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <path d="M138,328 L166,308 L192,318 L224,292 L258,302" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="258" cy="302" r="5" fill="#34d399">
      <animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>