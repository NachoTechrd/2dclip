<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="stressBg" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#fb923c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skinStress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="tieRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="200" cy="195" r="175" fill="url(#stressBg)"/>
  <ellipse cx="200" cy="368" rx="115" ry="15" fill="#020617" opacity="0.45"/>

  <!-- Chaos Lightning & Stress Symbols -->
  <path d="M84,112 L102,86 L92,86 L108,58" fill="none" stroke="#facc15" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <path d="M312,114 L296,86 L306,86 L290,56" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#drop)">
    <!-- Shirt & Messy Collar -->
    <path d="M98,354 C100,260 132,226 200,226 C268,226 300,260 302,354 Z" fill="url(#shirtGrad)" stroke="#0f172a" stroke-width="5"/>
    <path d="M168,226 L200,268 L232,226" fill="#ffffff" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
    <!-- Crooked Red Tie -->
    <path d="M192,254 L208,254 L222,334 L208,348 L196,334 Z" fill="url(#tieRed)" stroke="#0f172a" stroke-width="4" transform="rotate(-7 200 265)"/>

    <!-- Hands pulling head in panic -->
    <path d="M110,275 C84,230 92,165 124,145" fill="none" stroke="url(#shirtGrad)" stroke-width="26" stroke-linecap="round"/>
    <path d="M110,275 C84,230 92,165 124,145" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <path d="M290,275 C316,230 308,165 276,145" fill="none" stroke="url(#shirtGrad)" stroke-width="26" stroke-linecap="round"/>
    <path d="M290,275 C316,230 308,165 276,145" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>

    <!-- Neck & Head -->
    <rect x="180" y="198" width="40" height="32" rx="10" fill="#fb923c" stroke="#0f172a" stroke-width="4"/>
    <rect x="132" y="88" width="136" height="122" rx="54" fill="url(#skinStress)" stroke="#0f172a" stroke-width="5"/>

    <!-- Messy Stressed Hair -->
    <path d="M132,130 C128,74 176,56 208,60 C248,64 274,88 268,130 C254,104 232,96 206,102 C180,88 148,100 132,130 Z" fill="#1e293b" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
    <!-- Hands gripping sides of head -->
    <circle cx="128" cy="145" r="18" fill="url(#skinStress)" stroke="#0f172a" stroke-width="4"/>
    <circle cx="272" cy="145" r="18" fill="url(#skinStress)" stroke="#0f172a" stroke-width="4"/>

    <!-- Wide panicked eyes + dark circles -->
    <circle cx="174" cy="142" r="16" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
    <circle cx="226" cy="142" r="16" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
    <circle cx="176" cy="142" r="5" fill="#0f172a"/>
    <circle cx="224" cy="142" r="5" fill="#0f172a"/>
    <!-- Furrowed Brows -->
    <path d="M156,122 L190,130" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <path d="M244,122 L210,130" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>

    <!-- Wavy Shocked Mouth -->
    <path d="M174,178 Q187,168 200,178 Q213,188 226,176" fill="none" stroke="#7f1d1d" stroke-width="5" stroke-linecap="round"/>

    <!-- Sweat Drop -->
    <path d="M248,108 C258,122 258,132 248,132 C238,132 238,122 248,108 Z" fill="#38bdf8" stroke="#0f172a" stroke-width="2.5">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,10; 0,0" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>