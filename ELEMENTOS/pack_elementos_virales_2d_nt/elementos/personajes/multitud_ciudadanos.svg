<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="crowdAura" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="p4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#facc15"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="crowdDrop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <circle cx="200" cy="215" r="170" fill="url(#crowdAura)"/>
  <ellipse cx="200" cy="356" rx="165" ry="18" fill="#020617" opacity="0.45"/>

  <g filter="url(#crowdDrop)">
    <!-- Back row silhouettes -->
    <g opacity="0.85">
      <circle cx="90" cy="148" r="24" fill="#fde68a" stroke="#0f172a" stroke-width="4"/>
      <path d="M54,244 C54,196 126,196 126,244 Z" fill="#6366f1" stroke="#0f172a" stroke-width="4"/>
      <circle cx="310" cy="148" r="24" fill="#fed7aa" stroke="#0f172a" stroke-width="4"/>
      <path d="M274,244 C274,196 346,196 346,244 Z" fill="#14b8a6" stroke="#0f172a" stroke-width="4"/>
      <circle cx="200" cy="126" r="26" fill="#fbcfe8" stroke="#0f172a" stroke-width="4"/>
      <path d="M160,226 C160,176 240,176 240,226 Z" fill="#f97316" stroke="#0f172a" stroke-width="4"/>
    </g>

    <!-- Front row crisp characters -->
    <g>
      <circle cx="114" cy="206" r="30" fill="#fed7aa" stroke="#0f172a" stroke-width="4.5"/>
      <path d="M90,192 Q114,170 138,192" fill="#1e293b"/>
      <path d="M68,334 C68,266 160,266 160,334 Z" fill="url(#p2)" stroke="#0f172a" stroke-width="4.5"/>

      <circle cx="286" cy="206" r="30" fill="#fdba74" stroke="#0f172a" stroke-width="4.5"/>
      <path d="M262,190 Q286,166 310,190" fill="#0f172a"/>
      <path d="M240,334 C240,266 332,266 332,334 Z" fill="url(#p3)" stroke="#0f172a" stroke-width="4.5"/>

      <!-- Center Hero Citizen -->
      <circle cx="200" cy="196" r="34" fill="#fed7aa" stroke="#0f172a" stroke-width="5"/>
      <path d="M170,180 C176,154 224,154 230,180 Z" fill="#1e293b"/>
      <path d="M148,346 C148,262 252,262 252,346 Z" fill="url(#p1)" stroke="#0f172a" stroke-width="5"/>
      <circle cx="188" cy="196" r="4" fill="#0f172a"/>
      <circle cx="212" cy="196" r="4" fill="#0f172a"/>
      <path d="M188,210 Q200,220 212,210" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>