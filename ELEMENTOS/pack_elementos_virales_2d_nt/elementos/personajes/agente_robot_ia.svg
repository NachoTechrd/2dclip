<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="robotAura" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shellGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="coreCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <circle cx="200" cy="190" r="175" fill="url(#robotAura)"/>
  <ellipse cx="200" cy="366" rx="108" ry="16" fill="#020617" opacity="0.48"/>

  <!-- Orbiting neural data rings -->
  <ellipse cx="200" cy="195" rx="145" ry="42" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.55" transform="rotate(-14 200 195)"/>
  <circle cx="332" cy="158" r="5" fill="#38bdf8" filter="url(#neonGlow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#softShadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="3.2s" repeatCount="indefinite"/>

    <!-- Neck & Shoulders -->
    <rect x="178" y="184" width="44" height="24" rx="8" fill="#334155" stroke="#0f172a" stroke-width="4"/>
    <path d="M98,275 C98,218 140,204 200,204 C260,204 302,218 302,275 L292,350 L108,350 Z" fill="url(#shellGrad)" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/>
    <!-- Dark Suit Lapels & Tie -->
    <path d="M132,212 L200,320 L268,212 L248,205 L200,282 L152,205 Z" fill="#1e293b" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M188,238 L212,238 L206,308 L200,316 L194,308 Z" fill="url(#coreCyan)" filter="url(#neonGlow)"/>

    <!-- Chest Reactor -->
    <circle cx="242" cy="264" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="242" cy="264" r="7" fill="#22d3ee" filter="url(#neonGlow)">
      <animate attributeName="r" values="5.5;8;5.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Floating Hands / Hologram UI -->
    <rect x="66" y="254" width="42" height="58" rx="14" fill="url(#shellGrad)" stroke="#0f172a" stroke-width="4" transform="rotate(-12 87 283)"/>
    <rect x="292" y="254" width="42" height="58" rx="14" fill="url(#shellGrad)" stroke="#0f172a" stroke-width="4" transform="rotate(12 313 283)"/>

    <!-- Antenna & Ear Pods -->
    <line x1="200" y1="68" x2="200" y2="38" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="200" cy="34" r="9" fill="#22d3ee" stroke="#0f172a" stroke-width="3" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="94" y="112" width="22" height="52" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
    <rect x="284" y="112" width="22" height="52" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
    <rect x="99" y="124" width="6" height="28" rx="3" fill="#38bdf8" filter="url(#neonGlow)"/>
    <rect x="295" y="124" width="6" height="28" rx="3" fill="#38bdf8" filter="url(#neonGlow)"/>

    <!-- Head Helmet -->
    <rect x="114" y="68" width="172" height="126" rx="44" fill="url(#shellGrad)" stroke="#0f172a" stroke-width="5"/>
    <!-- Specular Top Gloss -->
    <path d="M142,84 Q200,74 258,84" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

    <!-- OLED Glass Visor -->
    <rect x="130" y="96" width="140" height="78" rx="26" fill="url(#visorGrad)" stroke="#334155" stroke-width="3"/>
    <!-- Glowing Eyes -->
    <rect x="155" y="122" width="28" height="20" rx="10" fill="url(#coreCyan)" filter="url(#neonGlow)">
      <animate attributeName="height" values="20;20;3;20" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="217" y="122" width="28" height="20" rx="10" fill="url(#coreCyan)" filter="url(#neonGlow)">
      <animate attributeName="height" values="20;20;3;20" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- AI Equalizer Smile -->
    <path d="M174,158 Q200,168 226,158" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>
    <!-- Glass Glare -->
    <path d="M142,106 L168,106 L148,136 Z" fill="#ffffff" opacity="0.14"/>
  </g>
</svg>