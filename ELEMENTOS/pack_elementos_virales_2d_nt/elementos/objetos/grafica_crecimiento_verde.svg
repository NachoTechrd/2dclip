<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="chartAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="chartDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="172" fill="url(#chartAura)"/>
  <g filter="url(#chartDrop)">
    <!-- Board Backdrop -->
    <rect x="44" y="54" width="312" height="292" rx="24" fill="#0f172a" stroke="#334155" stroke-width="5"/>
    <!-- Grid Lines -->
    <g stroke="#1e293b" stroke-width="2">
      <line x1="72" y1="120" x2="328" y2="120"/>
      <line x1="72" y1="185" x2="328" y2="185"/>
      <line x1="72" y1="250" x2="328" y2="250"/>
      <line x1="72" y1="312" x2="328" y2="312"/>
    </g>
    <!-- Ascending Bars -->
    <rect x="86" y="256" width="42" height="56" rx="8" fill="#334155"/>
    <rect x="144" y="214" width="42" height="98" rx="8" fill="#0284c7"/>
    <rect x="202" y="164" width="42" height="148" rx="8" fill="url(#barGreen)"/>
    <rect x="260" y="106" width="42" height="206" rx="8" fill="#10b981" stroke="#a7f3d0" stroke-width="2.5"/>

    <!-- Golden Growth Arrow -->
    <path d="M78,236 L156,192 L214,148 L308,82" fill="none" stroke="#facc15" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="318,74 282,78 302,108" fill="#facc15"/>
    <text x="120" y="106" font-family="Arial Black" font-size="30" fill="#34d399">+340%</text>
  </g>
</svg>