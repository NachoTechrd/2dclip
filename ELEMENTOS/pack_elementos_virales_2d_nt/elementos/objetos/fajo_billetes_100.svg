<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="cashAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="billFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="billStackSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="strapGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="cashDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="170" fill="url(#cashAura)"/>
  <ellipse cx="200" cy="340" rx="140" ry="18" fill="#020617" opacity="0.45"/>

  <g filter="url(#cashDrop)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="2.8s" repeatCount="indefinite"/>
    <!-- Back stack (tilted) -->
    <g transform="rotate(-10 200 210)">
      <rect x="64" y="136" width="272" height="140" rx="14" fill="url(#billStackSide)" stroke="#0f172a" stroke-width="5"/>
      <rect x="64" y="106" width="272" height="140" rx="14" fill="url(#billFace)" stroke="#0f172a" stroke-width="5"/>
    </g>

    <!-- Front Hero Cash Stack -->
    <g transform="rotate(4 200 220)">
      <path d="M56,220 L56,286 C56,294 64,300 72,300 L328,300 C336,300 344,294 344,286 L344,220 Z" fill="url(#billStackSide)" stroke="#0f172a" stroke-width="5"/>
      <line x1="66" y1="252" x2="334" y2="252" stroke="#34d399" stroke-width="2" opacity="0.5"/>
      <line x1="66" y1="268" x2="334" y2="268" stroke="#34d399" stroke-width="2" opacity="0.5"/>
      <line x1="66" y1="284" x2="334" y2="284" stroke="#34d399" stroke-width="2" opacity="0.5"/>

      <!-- Top crisp 100 bill -->
      <rect x="56" y="138" width="288" height="142" rx="14" fill="url(#billFace)" stroke="#0f172a" stroke-width="5"/>
      <rect x="70" y="152" width="260" height="114" rx="8" fill="none" stroke="#ecfdf5" stroke-width="3" stroke-dasharray="10 4" opacity="0.8"/>

      <!-- Corner denominations -->
      <text x="84" y="182" font-family="Arial Black" font-size="22" fill="#022c22">100</text>
      <text x="276" y="254" font-family="Arial Black" font-size="22" fill="#022c22">100</text>

      <!-- Gold Treasury Band -->
      <rect x="166" y="134" width="68" height="168" rx="6" fill="url(#strapGold)" stroke="#0f172a" stroke-width="4.5"/>
      <circle cx="200" cy="209" r="24" fill="#ecfdf5" stroke="#0f172a" stroke-width="3.5"/>
      <text x="200" y="220" text-anchor="middle" font-family="Arial Black" font-size="30" fill="#065f46">$</text>
    </g>
  </g>
</svg>