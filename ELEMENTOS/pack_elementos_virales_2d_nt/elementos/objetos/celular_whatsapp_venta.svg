<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="phoneAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phoneFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="phoneDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="9" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="175" fill="url(#phoneAura)"/>

  <g filter="url(#phoneDrop)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="2.8s" repeatCount="indefinite"/>
    <!-- Smartphone Chassis -->
    <rect x="112" y="34" width="176" height="332" rx="30" fill="url(#phoneFrame)" stroke="#475569" stroke-width="5"/>
    <!-- OLED Screen -->
    <rect x="124" y="48" width="152" height="304" rx="22" fill="#0f172a"/>
    <!-- Dynamic Island -->
    <rect x="170" y="58" width="60" height="14" rx="7" fill="#020617"/>

    <!-- WhatsApp Header -->
    <rect x="132" y="82" width="136" height="34" rx="10" fill="#065f46"/>
    <circle cx="150" cy="99" r="10" fill="#10b981"/>
    <rect x="168" y="93" width="76" height="10" rx="5" fill="#d1fae5"/>

    <!-- Incoming Message Bubble -->
    <rect x="136" y="130" width="112" height="38" rx="10" fill="#1e293b"/>
    <rect x="148" y="142" width="84" height="10" rx="4" fill="#94a3b8"/>

    <!-- Outgoing Auto Reply Bubble -->
    <rect x="152" y="180" width="116" height="44" rx="10" fill="#059669"/>
    <rect x="164" y="192" width="88" height="10" rx="4" fill="#ffffff"/>
    <rect x="164" y="208" width="54" height="8" rx="4" fill="#a7f3d0"/>

    <!-- Live Payment / Sale Toast -->
    <g>
      <rect x="82" y="244" width="236" height="68" rx="16" fill="#10b981" stroke="#ecfdf5" stroke-width="3"/>
      <circle cx="116" cy="278" r="18" fill="#022c22"/>
      <text x="116" y="286" text-anchor="middle" font-family="Arial Black" font-size="22" fill="#34d399">$</text>
      <text x="146" y="272" font-family="Arial Black" font-size="14" fill="#022c22">¡PAGO RECIBIDO!</text>
      <text x="146" y="294" font-family="Arial Black" font-size="20" fill="#ffffff">+$490 USD</text>
    </g>
  </g>
</svg>