<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="trophyAura" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cupGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="cupDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="172" fill="url(#trophyAura)"/>
  <ellipse cx="200" cy="356" rx="112" ry="15" fill="#020617" opacity="0.5"/>

  <g filter="url(#cupDrop)">
    <!-- Handles -->
    <path d="M126,98 C72,98 72,188 134,196" fill="none" stroke="#f59e0b" stroke-width="18" stroke-linecap="round"/>
    <path d="M274,98 C328,98 328,188 266,196" fill="none" stroke="#f59e0b" stroke-width="18" stroke-linecap="round"/>
    <!-- Stem & Plinth -->
    <rect x="182" y="232" width="36" height="64" fill="url(#cupGold)" stroke="#0f172a" stroke-width="4"/>
    <rect x="134" y="294" width="132" height="24" rx="6" fill="url(#cupGold)" stroke="#0f172a" stroke-width="4"/>
    <rect x="112" y="316" width="176" height="30" rx="8" fill="#1e293b" stroke="#facc15" stroke-width="3.5"/>
    <!-- Cup Bowl -->
    <path d="M114,68 L286,68 C286,184 248,242 200,242 C152,242 114,184 114,68 Z" fill="url(#cupGold)" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/>
    <!-- #1 Star -->
    <polygon points="200,104 212,130 240,134 220,154 225,182 200,168 175,182 180,154 160,134 188,130" fill="#fef9c3" stroke="#78350f" stroke-width="3"/>
  </g>
</svg>