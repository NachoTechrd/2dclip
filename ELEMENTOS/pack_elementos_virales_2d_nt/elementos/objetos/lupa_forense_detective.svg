<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="lensAura" cx="45%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glassBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7"/>
    </radialGradient>
    <linearGradient id="rimMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="lensDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <circle cx="195" cy="195" r="170" fill="url(#lensAura)"/>
  <g filter="url(#lensDrop)">
    <animateTransform attributeName="transform" type="rotate" values="-4 200 200; 4 200 200; -4 200 200" dur="4s" repeatCount="indefinite"/>
    <!-- Handle -->
    <path d="M242,242 L338,338" stroke="#0f172a" stroke-width="34" stroke-linecap="round"/>
    <path d="M246,246 L334,334" stroke="#f59e0b" stroke-width="22" stroke-linecap="round"/>
    <line x1="254" y1="254" x2="274" y2="274" stroke="#94a3b8" stroke-width="24" stroke-linecap="round"/>

    <!-- Rim -->
    <circle cx="176" cy="176" r="106" fill="url(#rimMetal)" stroke="#0f172a" stroke-width="6"/>
    <circle cx="176" cy="176" r="84" fill="url(#glassBlue)" stroke="#0f172a" stroke-width="4"/>

    <!-- Forensic Crosshair inside lens -->
    <circle cx="176" cy="176" r="52" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
    <line x1="176" y1="112" x2="176" y2="240" stroke="#e0f2fe" stroke-width="2" opacity="0.5"/>
    <line x1="112" y1="176" x2="240" y2="176" stroke="#e0f2fe" stroke-width="2" opacity="0.5"/>
    <!-- Specular Glare -->
    <path d="M120,142 A68,68 0 0,1 182,106" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>