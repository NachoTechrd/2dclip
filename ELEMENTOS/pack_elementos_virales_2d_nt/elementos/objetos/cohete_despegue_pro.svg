<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="rocketGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.4"/>
      <stop offset="65%" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hullWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="flameHot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="rocketDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="176" fill="url(#rocketGlow)"/>
  <g filter="url(#rocketDrop)" transform="rotate(24 200 200)">
    <animateTransform attributeName="transform" type="translate" values="0,6; 0,-8; 0,6" dur="1.8s" repeatCount="indefinite" additive="sum"/>
    <!-- Thruster Flame -->
    <path d="M174,284 C166,326 184,366 200,378 C216,366 234,326 226,284 Z" fill="url(#flameHot)">
      <animate attributeName="d" values="M174,284 C166,326 184,366 200,378 C216,366 234,326 226,284 Z; M178,284 C168,318 186,350 200,360 C214,350 232,318 222,284 Z; M174,284 C166,326 184,366 200,378 C216,366 234,326 226,284 Z" dur="0.35s" repeatCount="indefinite"/>
    </path>
    <!-- Side Fins -->
    <path d="M150,214 L106,274 L152,272 Z" fill="#ef4444" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M250,214 L294,274 L248,272 Z" fill="#ef4444" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Nozzle -->
    <polygon points="172,274 228,274 220,294 180,294" fill="#334155" stroke="#0f172a" stroke-width="4"/>
    <!-- Main Fuselage -->
    <path d="M200,38 C248,88 262,174 246,276 L154,276 C138,174 152,88 200,38 Z" fill="url(#hullWhite)" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/>
    <!-- Nose Cone -->
    <path d="M200,38 C222,62 234,88 240,114 L160,114 C166,88 178,62 200,38 Z" fill="#ef4444" stroke="#0f172a" stroke-width="4.5"/>
    <!-- Porthole Window -->
    <circle cx="200" cy="172" r="34" fill="#1e293b" stroke="#0f172a" stroke-width="4.5"/>
    <circle cx="200" cy="172" r="24" fill="#38bdf8"/>
    <path d="M184,160 A18,18 0 0,1 208,154" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>