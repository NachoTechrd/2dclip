<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="recAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperSheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="recDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="172" fill="url(#recAura)"/>
  <g filter="url(#recDrop)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="3s" repeatCount="indefinite"/>
    <!-- Jagged Receipt Paper -->
    <path d="M96,46 L304,46 L304,344 L286,328 L268,344 L250,328 L232,344 L214,328 L196,344 L178,328 L160,344 L142,328 L124,344 L106,328 L96,344 Z" fill="url(#paperSheet)" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/>
    <!-- Header -->
    <text x="200" y="92" text-anchor="middle" font-family="monospace" font-weight="900" font-size="24" fill="#0f172a">LA CUENTA</text>
    <line x1="120" y1="112" x2="280" y2="112" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 4"/>
    <!-- Line Items -->
    <rect x="120" y="132" width="102" height="12" rx="4" fill="#cbd5e1"/>
    <text x="280" y="143" text-anchor="end" font-family="monospace" font-weight="bold" font-size="16" fill="#334155">$450</text>
    <rect x="120" y="164" width="84" height="12" rx="4" fill="#cbd5e1"/>
    <text x="280" y="175" text-anchor="end" font-family="monospace" font-weight="bold" font-size="16" fill="#334155">$980</text>
    <rect x="120" y="196" width="114" height="12" rx="4" fill="#cbd5e1"/>
    <text x="280" y="207" text-anchor="end" font-family="monospace" font-weight="bold" font-size="16" fill="#334155">$1,250</text>
    <line x1="120" y1="228" x2="280" y2="228" stroke="#0f172a" stroke-width="3"/>
    <!-- Total -->
    <text x="120" y="264" font-family="Arial Black" font-size="20" fill="#0f172a">TOTAL</text>
    <text x="280" y="264" text-anchor="end" font-family="Arial Black" font-size="24" fill="#dc2626">$$$</text>
    <!-- Red Stamp Mark -->
    <g transform="rotate(-12 200 296)">
      <rect x="132" y="276" width="136" height="36" rx="6" fill="none" stroke="#ef4444" stroke-width="4"/>
      <text x="200" y="301" text-anchor="middle" font-family="Arial Black" font-size="18" fill="#ef4444">PAGAR HOY</text>
    </g>
  </g>
</svg>