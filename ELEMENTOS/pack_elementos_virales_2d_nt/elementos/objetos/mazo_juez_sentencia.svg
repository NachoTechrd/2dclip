<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="gavelAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="woodMahogany" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="55%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="brassRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="gavelDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="172" fill="url(#gavelAura)"/>
  <ellipse cx="200" cy="346" rx="135" ry="16" fill="#020617" opacity="0.5"/>

  <g filter="url(#gavelDrop)">
    <!-- Sound Block Base -->
    <rect x="86" y="302" width="228" height="32" rx="10" fill="url(#woodMahogany)" stroke="#0f172a" stroke-width="5"/>
    <rect x="112" y="280" width="176" height="24" rx="8" fill="#78350f" stroke="#0f172a" stroke-width="4"/>

    <!-- Striking Gavel -->
    <g transform="rotate(-24 190 175)">
      <animateTransform attributeName="transform" type="rotate" values="-28 190 175; -8 190 175; -28 190 175" dur="2.2s" repeatCount="indefinite"/>
      <!-- Handle -->
      <rect x="176" y="168" width="28" height="162" rx="12" fill="url(#woodMahogany)" stroke="#0f172a" stroke-width="5"/>
      <!-- Hammer Head -->
      <rect x="114" y="102" width="152" height="72" rx="14" fill="url(#woodMahogany)" stroke="#0f172a" stroke-width="5"/>
      <!-- Brass End Caps -->
      <rect x="100" y="96" width="24" height="84" rx="8" fill="url(#brassRing)" stroke="#0f172a" stroke-width="4"/>
      <rect x="256" y="96" width="24" height="84" rx="8" fill="url(#brassRing)" stroke="#0f172a" stroke-width="4"/>
      <line x1="138" y1="114" x2="242" y2="114" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
    </g>
  </g>
</svg>