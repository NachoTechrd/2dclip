<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="goldAura" cx="50%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="goldDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <circle cx="200" cy="215" r="170" fill="url(#goldAura)"/>
  <ellipse cx="200" cy="346" rx="154" ry="18" fill="#020617" opacity="0.5"/>

  <g filter="url(#goldDrop)">
    <!-- Bottom Left Bar -->
    <polygon points="50,310 74,236 178,236 196,310" fill="url(#goldSide)" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round"/>
    <polygon points="68,262 84,236 168,236 182,262" fill="url(#goldTop)" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Bottom Right Bar -->
    <polygon points="204,310 222,236 326,236 350,310" fill="url(#goldSide)" stroke="#0f172a" stroke-width="4.5" stroke-linejoin="round"/>
    <polygon points="218,262 232,236 316,236 332,262" fill="url(#goldTop)" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Top Crown Bullion Bar -->
    <polygon points="122,238 148,154 252,154 278,238" fill="url(#goldSide)" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="142,184 158,154 242,154 258,184" fill="url(#goldTop)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
    <text x="200" y="218" text-anchor="middle" font-family="Arial Black" font-size="20" fill="#451a03" opacity="0.85">999.9</text>
  </g>

  <!-- Sparkle Stars -->
  <path d="M114,122 L120,136 L134,142 L120,148 L114,162 L108,148 L94,142 L108,136 Z" fill="#fef08a">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <path d="M294,108 L299,119 L310,124 L299,129 L294,140 L289,129 L278,124 L289,119 Z" fill="#fde047">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.7s" repeatCount="indefinite"/>
  </path>
</svg>