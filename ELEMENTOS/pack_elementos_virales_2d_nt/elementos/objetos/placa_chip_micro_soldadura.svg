<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="chipAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pcbGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldPins" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="chipDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="172" fill="url(#chipAura)"/>

  <g filter="url(#chipDrop)">
    <!-- PCB Motherboard -->
    <rect x="48" y="48" width="304" height="304" rx="28" fill="url(#pcbGreen)" stroke="#10b981" stroke-width="4"/>
    <!-- Copper Traces -->
    <g fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" opacity="0.55">
      <path d="M120,48 L120,104 L144,128"/>
      <path d="M168,48 L168,128"/>
      <path d="M232,48 L232,128"/>
      <path d="M280,48 L280,104 L256,128"/>
      <path d="M48,140 L108,140 L132,164"/>
      <path d="M48,200 L124,200"/>
      <path d="M48,260 L108,260 L132,236"/>
      <path d="M352,140 L292,140 L268,164"/>
      <path d="M352,200 L276,200"/>
      <path d="M352,260 L292,260 L268,236"/>
    </g>

    <!-- Gold IC Pins -->
    <g fill="url(#goldPins)" stroke="#0f172a" stroke-width="2">
      <rect x="138" y="114" width="12" height="22" rx="3"/>
      <rect x="166" y="114" width="12" height="22" rx="3"/>
      <rect x="194" y="114" width="12" height="22" rx="3"/>
      <rect x="222" y="114" width="12" height="22" rx="3"/>
      <rect x="250" y="114" width="12" height="22" rx="3"/>

      <rect x="138" y="264" width="12" height="22" rx="3"/>
      <rect x="166" y="264" width="12" height="22" rx="3"/>
      <rect x="194" y="264" width="12" height="22" rx="3"/>
      <rect x="222" y="264" width="12" height="22" rx="3"/>
      <rect x="250" y="264" width="12" height="22" rx="3"/>

      <rect x="114" y="138" width="22" height="12" rx="3"/>
      <rect x="114" y="166" width="22" height="12" rx="3"/>
      <rect x="114" y="194" width="22" height="12" rx="3"/>
      <rect x="114" y="222" width="22" height="12" rx="3"/>
      <rect x="114" y="250" width="22" height="12" rx="3"/>

      <rect x="264" y="138" width="22" height="12" rx="3"/>
      <rect x="264" y="166" width="22" height="12" rx="3"/>
      <rect x="264" y="194" width="22" height="12" rx="3"/>
      <rect x="264" y="222" width="22" height="12" rx="3"/>
      <rect x="264" y="250" width="22" height="12" rx="3"/>
    </g>

    <!-- Silicon CPU Core -->
    <rect x="132" y="132" width="136" height="136" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="4.5"/>
    <rect x="150" y="150" width="100" height="100" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="200" y="208" text-anchor="middle" font-family="Arial Black" font-size="30" fill="#22d3ee">AI</text>
    <circle cx="200" cy="200" r="6" fill="#22d3ee" opacity="0.25">
      <animate attributeName="r" values="6;46;6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>