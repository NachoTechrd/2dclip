<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="brainAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brainPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="nodeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="175" fill="url(#brainAura)"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="3s" repeatCount="indefinite"/>
    <!-- Left & Right Hemispheres -->
    <path d="M196,86 C132,86 82,130 82,188 C82,232 108,268 148,282 C154,302 178,312 196,304 Z" fill="url(#brainPink)" stroke="#0f172a" stroke-width="5"/>
    <path d="M204,86 C268,86 318,130 318,188 C318,232 292,268 252,282 C246,302 222,312 204,304 Z" fill="url(#brainPink)" stroke="#0f172a" stroke-width="5"/>

    <!-- Neural Folds & Circuit Connections -->
    <g fill="none" stroke="#e0f2fe" stroke-width="3.5" stroke-linecap="round" opacity="0.8">
      <path d="M126,154 Q154,138 176,162"/>
      <path d="M114,204 Q146,192 174,224"/>
      <path d="M274,154 Q246,138 224,162"/>
      <path d="M286,204 Q254,192 226,224"/>
      <line x1="150" y1="146" x2="250" y2="146" stroke-dasharray="6 4"/>
      <line x1="138" y1="208" x2="262" y2="208" stroke-dasharray="6 4"/>
    </g>

    <!-- Glowing Synapses -->
    <g fill="#22d3ee" filter="url(#nodeGlow)">
      <circle cx="150" cy="146" r="7"/>
      <circle cx="250" cy="146" r="7"/>
      <circle cx="138" cy="208" r="8">
        <animate attributeName="r" values="6;10;6" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="262" cy="208" r="8">
        <animate attributeName="r" values="10;6;10" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="200" cy="176" r="10" fill="#facc15"/>
    </g>
  </g>
</svg>