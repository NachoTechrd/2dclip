<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="lockAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="lockDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="172" fill="url(#lockAura)"/>
  <g filter="url(#lockDrop)">
    <!-- Steel Shackle -->
    <path d="M142,172 L142,118 C142,74 258,74 258,118 L258,172" fill="none" stroke="#cbd5e1" stroke-width="26" stroke-linecap="round"/>
    <path d="M142,172 L142,118 C142,74 258,74 258,118 L258,172" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <!-- Lock Body -->
    <rect x="98" y="166" width="204" height="176" rx="28" fill="url(#shieldGold)" stroke="#0f172a" stroke-width="5"/>
    <rect x="114" y="182" width="172" height="144" rx="20" fill="none" stroke="#bae6fd" stroke-width="2.5" opacity="0.5"/>
    <!-- Keyhole -->
    <circle cx="200" cy="238" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="190,252 210,252 216,294 184,294" fill="#0f172a"/>
    <circle cx="200" cy="238" r="10" fill="#22d3ee">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>